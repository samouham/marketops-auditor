<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Success – MarketOps Cloud</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    body {
      background-color: #f9fafb;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
    }

    .thank-you-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .thank-you-card {
      background: #ffffff;
      padding: 60px 40px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.05);
      border: 1px solid #e5e7eb;
      max-width: 600px;
      text-align: center;
    }

    .success-icon {
      width: 80px;
      height: 80px;
      background: rgba(255, 153, 0, 0.1);
      color: #ff9900;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin: 0 auto 30px;
    }

    h1 {
      color: #0b3c5d;
      font-weight: 900;
      font-size: 32px;
      margin-bottom: 20px;
    }

    p {
      color: #6b7280;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    .btn-primary {
      background: #ff9900;
      color: white;
      padding: 16px 32px;
      border-radius: 12px;
      font-weight: 800;
      text-decoration: none;
      transition: 0.3s;
      width: 100%;
      max-width: 250px;
    }

    .btn-primary:hover {
      background: #e68a00;
      transform: translateY(-2px);
    }

    .btn-secondary {
      color: #0b3c5d;
      font-weight: 700;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn-secondary:hover {
      color: #ff9900;
    }

    footer {
      padding: 40px;
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="thank-you-container">
  <div class="thank-you-card">
    <div class="success-icon">
      <i class="fa-solid fa-check"></i>
    </div>
    <h1>Inquiry Received!</h1>
    <p>
      Thank you for reaching out. An AWS Marketplace Technical Account Manager 
      will review your inquiry and contact you via 
      <strong>admin@marketopscloud.com</strong> within 4 business hours.
    </p>
    
    <div class="button-group">
      <a href="index.html" class="btn-primary">Return Home</a>
      <a href="roadmap.html" class="btn-secondary">View our Roadmap &rarr;</a>
    </div>
  </div>
</div>

<footer>
  <p>&copy; 2025 MarketOps Cloud. All rights reserved.</p>
</footer>

</body>
</html>
