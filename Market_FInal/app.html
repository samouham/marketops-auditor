<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarketOps | Operational OS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Public+Sans:wght@400;600&family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-surface: #F9FAFB;
      --navy-os: #0B1E33;
      --aws-gold: #FF9900;
      --action-blue: #3B82F6;
      --text-main: #1F2937;
      --text-muted: #6B7280;
      --border-subtle: #E5E7EB;
      --forest-green: #15803D;
      --critical-red: #B91C1C;
      --ai-indigo: #4338CA;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-surface); font-family: 'Inter', sans-serif; color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    /* --- SIDEBAR --- */
    .sidebar { width: 260px; background: var(--navy-os); padding: 32px 20px; display: flex; flex-direction: column; flex-shrink: 0; }
    .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: #94A3B8; text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: 500; margin-bottom: 4px; transition: 0.2s; }
    .nav-link:hover, .nav-link.active { background: rgba(255, 255, 255, 0.05); color: white; }

    /* --- WORKSPACE --- */
    .workspace { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
    .header-os { padding: 12px 48px; background: white; border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; }
    
    .infra-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; background: #F1F5F9; padding: 4px 10px; border-radius: 4px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }

    /* --- PULSE ANIMATION --- */
    .pulse-dot { width: 8px; height: 8px; background: var(--forest-green); border-radius: 50%; display: inline-block; margin-right: 6px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.1); } 100% { opacity: 1; transform: scale(1); } }

    /* --- KPI CARDS --- */
    .kpi-row { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 20px; padding: 32px 48px 0; }
    .kpi-card { background: white; padding: 24px; border-radius: 12px; border: 1px solid var(--border-subtle); position: relative; transition: transform 0.2s; }
    .kpi-label { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .kpi-value { font-family: 'Inter', sans-serif; font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 8px; letter-spacing: -0.02em; }

    /* --- RECOVERY MACHINE --- */
    .recovery-group { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px; }
    .recovery-item { border-left: 2px solid #F1F5F9; padding-left: 16px; position: relative; }
    .action-trigger { display: inline-block; font-size: 9px; font-weight: 800; color: var(--action-blue); background: #EFF6FF; border: 1px solid #DBEAFE; padding: 4px 8px; border-radius: 4px; margin-top: 8px; cursor: pointer; text-transform: uppercase; }
    .action-trigger:hover { background: var(--action-blue); color: white; }

    /* --- TRUTH TABLES --- */
    .data-table { width: 100%; border-collapse: collapse; margin-top: 32px; }
    .data-table th { text-align: left; font-size: 10px; color: var(--text-muted); padding: 12px; border-bottom: 1px solid var(--border-subtle); text-transform: uppercase; letter-spacing: 0.05em; }
    .data-table td { padding: 16px 12px; font-size: 13px; border-bottom: 1px solid var(--border-subtle); }
    .currency { text-align: right !important; font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; font-weight: 700; }
    
    .source-tag { font-family: 'Public Sans', sans-serif; font-size: 10px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; cursor: help; }
    .source-tag i { color: var(--action-blue); }

    /* --- AI SIDEBAR --- */
    .ai-box { background: linear-gradient(135deg, #EEF2FF 0%, #FFFFFF 100%); border: 1px solid #C7D2FE; padding: 24px; border-radius: 12px; }
    .ai-btn { background: var(--ai-indigo); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: 700; font-size: 12px; margin-top: 16px; cursor: pointer; transition: 0.2s; }
    .ai-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  </style>
</head>
