<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sovereign-28 | Institutional Control Node</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://clerk.marketopscloud.com/npm/@clerk/clerk-js@5/dist/clerk.browser.js" 
            data-clerk-publishable-key="pk_live_Y2xlcmsubWFya2V0b3BzY2xvdWQuY29tJA" 
            async crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=JetBrains+Mono:wght@400;700&display=swap');
        :root { --neon-cyan: #22d3ee; --neon-emerald: #10b981; }
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; font-style: italic; overflow-x: hidden; }
        .glass-panel { 
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.6) 0%, rgba(2, 6, 23, 0.8) 100%);
            backdrop-filter: blur(25px); 
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .matrix-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 10px; }
        .status-dot { width: 14px; height: 14px; border-radius: 3px; background: rgba(255, 255, 255, 0.05); transition: all 0.6s; border: 1px solid rgba(255, 255, 255, 0.03); }
        .glow-cyan { background: var(--neon-cyan) !important; box-shadow: 0 0 20px rgba(34, 211, 238, 0.6); }
        .glow-emerald { background: var(--neon-emerald) !important; box-shadow: 0 0 20px rgba(16, 185, 129, 0.6); }
        .scan-line { width: 100%; height: 3px; background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent); position: absolute; top: 0; left: 0; animation: scan 4s infinite ease-in-out; opacity: 0.6; }
        @keyframes scan { 0% { top: 0%; opacity: 0; } 50% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
        .terminal-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-10 selection:bg-cyan-500/30">
    <div class="fixed inset-0 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-cyan-900/10 via-slate-950 to-black -z-10"></div>

    <div class="max-w-7xl mx-auto space-y-8">
        <nav class="flex justify-between items-center glass-panel px-8 py-6 rounded-3xl">
            <div class="flex items-center gap-6">
                <div class="bg-white p-2 rounded-xl">
                    <img src="https://raw.githubusercontent.com/lucide-icons/lucide/main/icons/shield-check.svg" alt="S-28" class="w-8 h-8 text-black">
                </div>
                <div>
                    <h1 class="text-white font-black text-2xl uppercase italic leading-none">Control Node</h1>
                    <span class="text-[9px] font-mono text-cyan-400 uppercase tracking-[0.4em] font-bold mt-1">Institutional Forensic Perimeter</span>
                </div>
            </div>
            <div id="user-button"></div>
        </nav>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="glass-panel p-8 rounded-[2.5rem] border-l-4 border-white/10">
                <p class="text-slate-500 text-[10px] font-black uppercase mb-4">Audit Completion</p>
                <p id="scan-status" class="text-5xl text-white font-black italic">0%</p>
            </div>
            <div class="glass-panel p-8 rounded-[2.5rem] border-l-4 border-cyan-500/50">
                <p class="text-slate-500 text-[10px] font-black uppercase mb-4">Drift Detected</p>
                <p id="drift-count" class="text-5xl text-cyan-400 font-black italic">--</p>
            </div>
            <div class="glass-panel p-8 rounded-[2.5rem] border-l-4 border-emerald-500/50">
                <p class="text-slate-500 text-[10px] font-black uppercase mb-4">EBITDA Recovery</p>
                <p id="recovery-val" class="text-5xl text-emerald-500 font-black italic">$0.00</p>
            </div>
            <button id="scan-btn" class="bg-cyan-500 text-black p-8 rounded-[2.5rem] font-black uppercase text-xs hover:scale-105 transition-all italic">
                Initialize Audit Scan
            </button>
        </div>

        <div class="lg:col-span-2 glass-panel rounded-[3.5rem] p-10 relative overflow-hidden">
            <div id="scanner-line" class="scan-line hidden"></div>
            <div class="matrix-grid mb-12" id="matrix-container"></div>
            <div id="terminal-log" class="terminal-text text-cyan-500/80 space-y-2 h-32 overflow-y-auto">
                <p>:: Node Standby...</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://2eytaets7y.us-east-1.awsapprunner.com";
        const container = document.getElementById('matrix-container');
        for (let i = 1; i <= 28; i++) {
            const dot = document.createElement('div');
            dot.className = "status-dot"; dot.id = `f-${i}`;
            container.appendChild(dot);
        }

        function log(msg) {
            const l = document.getElementById('terminal-log');
            const p = document.createElement('p');
            p.innerText = `:: ${new Date().toLocaleTimeString()}: ${msg}`;
            l.appendChild(p); l.scrollTop = l.scrollHeight;
        }

        window.addEventListener('load', async () => {
            try {
                await Clerk.load();
                if (!Clerk.user) {
                    window.location.href = "/sign-in";
                } else {
                    Clerk.mountUserButton(document.getElementById('user-button'), { afterSignOutUrl: window.location.origin });
                    setupScan();
                }
            } catch (err) {
                console.error("Clerk initialization error:", err);
                setupScan();
            }
        });

        function setupScan() {
            document.getElementById('scan-btn').onclick = async () => {
                const btn = document.getElementById('scan-btn');
                btn.disabled = true; btn.innerText = "SCANNING...";
                document.getElementById('scanner-line').classList.remove('hidden');
                log("INITIATING HANDSHAKE...");

                try {
                    const res = await fetch(`${API_URL}/api/execute-scan`, { 
                        method: 'POST',
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            regions: ["us-east-1"]
                        })
                    });
                    
                    if (!res.ok) {
                        throw new Error(`Server returned status ${res.status}`);
                    }

                    const data = await res.json();
                    let p = 0;
                    const inv = setInterval(() => {
                        if (p < 100) {
                            p++; document.getElementById('scan-status').innerText = p + "%";
                            if (p % 4 === 0) {
                                const id = Math.floor(Math.random()*28)+1;
                                document.getElementById(`f-${id}`).classList.add('glow-cyan');
                                log(`SECTOR F${id} VERIFIED`);
                            }
                        } else {
                            clearInterval(inv);
                            const summary = data.summary || {};
                            document.getElementById('drift-count').innerText = summary.total_findings !== undefined ? summary.total_findings : (data.drift_units || "0");
                            document.getElementById('recovery-val').innerText = summary.projected_annual_recovery_usd !== undefined ? `$${summary.projected_annual_recovery_usd.toLocaleString()}` : (data.recovery_est || "$0.00");
                            
                            btn.disabled = false; btn.innerText = "DOWNLOAD PDF";
                            btn.className = "bg-emerald-500 text-black p-8 rounded-[2.5rem] font-black italic transition-all";
                            btn.onclick = () => window.location.href = `${API_URL}/api/generate-artifact`;
                            for(let i=1;i<=28;i++) document.getElementById(`f-${i}`).classList.add('glow-emerald');
                        }
                    }, 40);
                } catch (e) { 
                    log(`API ERROR: ${e.message}`); 
                    btn.disabled = false; 
                    btn.innerText = "RETRY"; 
                    document.getElementById('scanner-line').classList.add('hidden');
                }
            };
        }
    </script>
</body>
</html>
